[pytest]
markers =
    correctness: Functional behavior, numerical equivalence, or regression guard.
    security: Cryptographic parameter, randomness, trust-boundary, or fail-closed invariant.
    contract: Public API, configuration, ownership, or compatibility contract.
    performance: Enforced latency, throughput, memory, or resource behavior.
    benchmark: Measurement/reporting workload without a stable regression threshold.
    unit: Isolated deterministic behavior without a complete runtime pipeline.
    integration: Behavior spanning multiple compiler or runtime components.
    inference: End-to-end model inference through a public demo surface.
    slow: Test is intentionally expensive and unsuitable for the fast presubmit suite.
    assets: Test requires model weights, data, or another repository-external asset.
    multi_device: Test requires or validates more than one accelerator/device.
    secure_profile: Test constructs or validates a 128-bit-secure inference profile.
    external: Test invokes or compares against a separately installed implementation.
